# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml – Component Detection App
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── FastAPI Backend (GPU) ───────────────────────────────────────────────────
  backend:
    image: tutitata0303/pcb_detection:latest
    container_name: component_detection_backend
    restart: unless-stopped

    # Expose the API on the host
    ports:
      - "8000:8000"

    # NVIDIA GPU access (requires nvidia-container-toolkit on the host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ── Bind Mounts (Updated) ──
    volumes:
      - ./backend/storage:/app/storage
      # Naya updated ml_pipeline.py direct container me load hoga
      - ./backend/app/ml_pipeline.py:/app/app/ml_pipeline.py

    # ── Environment Variables (Memory Fix added) ──
    environment:
      - PYTHONUNBUFFERED=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Flutter APK Builder (CPU only) ─────────────────────────────────────────
  apk-build:
    build:
      context: ./frontend_app
      dockerfile: Dockerfile
    container_name: component_detection_apk_builder
    profiles:
      - build